services:
  - type: web
    name: opspilot-web
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: opspilot-postgres
          property: connectionString
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: opspilot-ai-service
          envVarKey: RENDER_EXTERNAL_URL
      - key: GITHUB_WEBHOOK_SECRET
        generateValue: true

  - type: web
    name: opspilot-ai-service
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    rootDir: services/ai
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8

# Database schema is managed separately from the application build. The hosted
# demo already has the current Prisma schema; future schema changes should use
# a reviewed migration rather than a network-dependent db push during builds.
databases:
  - name: opspilot-postgres
    databaseName: opspilot
    user: opspilot
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []

previews:
  generation: off

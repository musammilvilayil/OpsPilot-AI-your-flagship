services:
  - type: web
    name: opspilot-web
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: opspilot-postgres
          property: connectionString
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: opspilot-ai-service
          envVarKey: RENDER_EXTERNAL_URL
      - key: GITHUB_WEBHOOK_SECRET
        generateValue: true

  - type: web
    name: opspilot-ai-service
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    rootDir: services/ai
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8

# The hosted free demo runs incident analysis synchronously. Redis/BullMQ remains
# available in the source architecture for a paid background-worker deployment.
databases:
  - name: opspilot-postgres
    databaseName: opspilot
    user: opspilot
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []

previews:
  generation: off
